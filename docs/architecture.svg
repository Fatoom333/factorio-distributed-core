<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Архитектура Factorio Distributed</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#FFFFFF"/>
<g font-size="14" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="20" width="600" height="220" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="340" y="44" fill="#3C3489" font-weight="600">Ядро: ПК хоста или VPS (Rust, без графики)</text>
<g fill="#CECBF6" stroke="#534AB7" stroke-width="0.6">
<rect x="55" y="68" width="130" height="56" rx="8"/><rect x="205" y="68" width="130" height="56" rx="8"/>
<rect x="355" y="68" width="130" height="56" rx="8"/><rect x="505" y="68" width="130" height="56" rx="8"/>
<rect x="55" y="150" width="180" height="56" rx="8"/><rect x="255" y="150" width="180" height="56" rx="8"/>
<rect x="455" y="150" width="180" height="56" rx="8"/></g>
<g fill="#26215C" font-weight="600">
<text x="120" y="86">Модель мира</text><text x="270" y="86">Граф потоков</text>
<text x="420" y="86">Разрезчик</text><text x="570" y="86">Планировщик</text>
<text x="145" y="168">Швы с откатом</text><text x="345" y="168">Курсор внимания</text>
<text x="545" y="168">Мост RCON</text></g>
<g fill="#534AB7" font-size="12">
<text x="120" y="106">ленты, машины, поезда</text><text x="270" y="106">кто во что втекает</text>
<text x="420" y="106">тонкие рёбра</text><text x="570" y="106">куски по машинам</text>
<text x="145" y="188">догадка, сверка, откат</text><text x="345" y="188">точно там, куда смотрят</text>
<text x="545" y="188">состояние → /fd, ввод ←</text></g>
<g stroke="#5F5E5A" stroke-width="1.5">
<line x1="185" y1="244" x2="185" y2="326" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="495" y1="244" x2="495" y2="326" marker-start="url(#a)" marker-end="url(#a)"/></g>
<text x="340" y="285" fill="#5F5E5A" font-size="12">интернет, UDP/QUIC: швы и подтверждения</text>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8">
<rect x="40" y="330" width="290" height="180" rx="20"/><rect x="350" y="330" width="290" height="180" rx="20"/></g>
<g fill="#085041" font-weight="600"><text x="185" y="352">ПК игрока А</text><text x="495" y="352">ПК игрока Б</text></g>
<g fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.6">
<rect x="55" y="372" width="260" height="44" rx="8"/><rect x="365" y="372" width="260" height="44" rx="8"/>
<rect x="55" y="434" width="120" height="56" rx="8"/><rect x="365" y="434" width="120" height="56" rx="8"/></g>
