<rect x="195" y="434" width="120" height="56" rx="8"/><rect x="505" y="434" width="120" height="56" rx="8"/></g>
<g fill="#04342C" font-weight="600">
<text x="185" y="394">Агент: сеть, NAT, RCON localhost</text><text x="495" y="394">Агент: сеть, NAT, RCON localhost</text>
<text x="115" y="452">Воркер ядра</text><text x="425" y="452">Воркер ядра</text></g>
<g fill="#2C2C2A" font-weight="600"><text x="255" y="452">Factorio</text><text x="565" y="452">Factorio</text></g>
<g fill="#0F6E56" font-size="12"><text x="115" y="472">свой кусок мира</text><text x="425" y="472">свой кусок мира</text></g>
