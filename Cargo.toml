[package]
name = "factorio-distributed-core"
version = "0.0.1"
edition = "2021"
description = "Серверное ядро: распределённая симуляция мира Factorio, клиенты-визуализаторы через RCON"
license = "Apache-2.0"
publish = false

[dependencies]
rcon = { version = "0.6", features = ["rt-tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
